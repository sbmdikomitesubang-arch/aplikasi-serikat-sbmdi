
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152e">

  <title>Loading - Portal SBMDI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: black;
      background: linear-gradient(180deg, #87CEEB 0%, #FFFFFF 100%);

    }

    .judul {
      color
    }

    .loading-container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      text-align: center;
      animation: fadeIn 1s ease both;
    }

    /* LOGO ANIMASI */

      .logo img {
       width: 120px;
       height: 120px;
       object-fit: contain;
       display: block;
    }
    

    .logo-area {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 35px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glow {
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: #248bff;
      filter: blur(42px);
      opacity: 0.4;
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      width: 150px;
      height: 150px;
      
      border-radius: 50%;
      animation: rotate 7s linear infinite;
    }

    .orbit::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      top: 17px;
      left: 24px;
      border-radius: 50%;
      background: #001f54;
      box-shadow: 0 0 15px rgba(0, 31, 84, 0.7);

    }

    .logo {
      position: relative;
      width: 25px;
      height: 25px;
      object-fit: contain;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.4);
      background: linear-gradient(
        145deg,
        #4faaff,
        #1253a1 48%,
        #09234b
      );
      box-shadow:
        0 15px 30px rgba(0,0,0,0.4),
        inset 0 2px 3px rgba(255,255,255,0.45),
        inset 0 -5px 10px rgba(0,0,0,0.25);
      transform: perspective(500px) rotateY(-8deg);
      animation: floatLogo 3s ease-in-out infinite;
    }

    .logo span {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.45);
    }

    /* JUDUL */

    /* PROGRESS BAR */

    .progress-area {
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
    }

    .progress-track {
      margin-bottom: 25px;
      width: 100%;
      height: 5px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,0.13);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        #2985ff,
        #8be5ff
      );
      box-shadow: 0 0 12px #369bff;
      animation: progress 9s linear forwards;
    }

    .loading-text {
      margin-top: 30px;
      font-size: 12px;
      color: #a9c8ed;
      letter-spacing: 1px;
      
    }


    /* ANIMASI */

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: perspective(500px)
          translateY(0) rotateY(-8deg);
      }
      50% {
        transform: perspective(500px)
          translateY(-8px) rotateY(8deg);
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      50% {
        opacity: 0.55;
        transform: scale(1.15);
      }
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-height: 600px) {
      .loading-container {
        padding: 12px 20px;
      }

      .logo-area {
        transform: scale(0.78);
        margin-bottom: 5px;
      }

      .motto {
        margin-bottom: 20px;
      }

      .footer {
        margin-top: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="loading-container">

    <div class="logo-area">
      <div class="glow"></div>
      <div class="orbit"></div>

      <div class="logo">
        <div class="wadah-logo">
        <img src="gambar/sbmdi1.png" alt="sbmdi1">
	</div>
      </div>
    </div>

    <div class="progress-area">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>

      <p class="Judul">Mohon Tunggu Sedang Menyiapkan Aplikasi</p>
      <p class="loading-text">
      </p>
    </div>

  </main>

  <script>
    // Waktu loading: 9 detik
    const DURASI_LOADING = 10000;

    // Halaman tujuan setelah loading
    const HALAMAN_BERANDA = "index.html";

    setTimeout(function () {
      window.location.replace(HALAMAN_BERANDA);
    }, DURASI_LOADING);
  </script>

</body>
</html>
