<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Anggota Serikat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #4682B4, #e9eef6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: #e9eef6;
      padding: 3rem 2.5rem;
      border-radius: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        12px 12px 12px #d1d9e6,
        -12px -12px 12px #ffffff;
    }

    .lock-icon img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      background: #e9eef6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 30px;
      box-shadow:
        6px 6px 12px #d1d9e6,
        -6px -6px 12px #ffffff;
    }

    h2 {
      text-align: center;
      color: #1a202c;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      background: #e9eef6;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      color: #2d3748;
      box-shadow:
        inset 6px 6px 12px #d1d9e6,
        inset -6px -6px 12px #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
      color: #a0aec0;
    }

    .input-group input:focus {
      box-shadow:
        inset 4px 4px 8px #d1d9e6,
        inset -4px -4px 8px #ffffff,
        0 0 0 2px rgba(66, 153, 225, 0.3);
    }

    .row-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      font-size: 0.85rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4a5568;
    }

    .forgot-link {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, #1a73e8, #00bfff);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(26, 115, 232, 0.5);
    }

    .login-message {
  display: none;
  width: 100%;
  box-sizing: border-box;
  padding: 16px 20px;
  margin-top: 15px;
  border: none;
  border-radius: 16px;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
  background: #e9eef6;
  box-shadow:
    inset 6px 6px 12px #d1d9e6,
    inset -6px -6px 12px #ffffff;
}

.login-message.success {
  display: block;
  color: #15803d;
}

.login-message.error {
  display: block;
  color: #dc2626;
}

  </style>
</head>
<body>

  <div class="login-container">
    <div class="lock-icon">
    <img src="gambar/sbmdi2.png" alt="Logo Login">
  </div>

    <h2>Selamat Datang</h2>
    <p class="subtitle">Silakan Masuk Dengan ID Share Anda</p>

  <div class="input-group">
    <input type="text" id="nama" placeholder="Nama Lengkap">
  </div>

  <div class="input-group">
    <input type="text" id="idShare" placeholder="ID Share">
  </div>

    <div class="row-options">
      <label class="remember">
        <input type="checkbox"> Ingat saya
      </label>
      <a href="#" class="forgot-link">Lupa ID?</a>
    </div>

    <button class="btn-login" id="btn-login" type="button">MASUK</button>

<div id="login-message" class="login-message"></div>
    <div id="login-message" class="login-message"></div>
  </div>

    <script>
    
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyWhCXJvf7OWFFh4z90PhoksoY7LnWBKn9ff9Q4T9kHH9ME0BVSWiOlecjZCLyKkoSG/exec";

document.getElementById("btn-login").addEventListener("click", function() {
  const nama = document.getElementById("nama").value.trim();
  const idShare = document.getElementById("idShare").value.trim();
  const pesan = document.getElementById("login-message");
  const tombol = document.getElementById("btn-login");

  if (!nama || !idShare) {
    tampilkanPesan("Nama Lengkap dan ID Share wajib diisi.", false);
    return;
  }

  tombol.disabled = true;
  tombol.textContent = "MEMERIKSA...";
  pesan.className = "login-message";
  pesan.style.display = "none";

  const callbackName = "hasilLoginSBMDI";

  window[callbackName] = function(hasil) {
    tampilkanPesan(
      hasil.message,
      hasil.status === "success"
    );

    tombol.disabled = false;
    tombol.textContent = "MASUK";

    delete window[callbackName];
    document.getElementById("script-login").remove();
  };

  const script = document.createElement("script");
  script.id = "script-login";

  script.onerror = function() {
    tampilkanPesan("Gagal menghubungi server. Silakan coba lagi.", false);
    tombol.disabled = false;
    tombol.textContent = "MASUK";
    delete window[callbackName];
    script.remove();
  };

  script.src = URL_APPS_SCRIPT +
    "?nama=" + encodeURIComponent(nama) +
    "&idShare=" + encodeURIComponent(idShare) +
    "&callback=" + callbackName;

  document.body.appendChild(script);
});

function tampilkanPesan(teks, berhasil) {
  const pesan = document.getElementById("login-message");

  pesan.textContent = berhasil
    ? "Login Berhasil"
    : teks === "Nama Lengkap atau ID Share tidak cocok."
      ? "Nama Lengkap atau ID Share TIDAK TERDAFTAR/BELUM LENGKAP"
      : teks;

  pesan.className = "login-message " +
    (berhasil ? "success" : "error");
  pesan.style.display = "block";
}

  </script>

</body>
</html>

</body>
</html>
