<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Anggota Serikat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #4682B4, #e9eef6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      position: relative;
      background: #e9eef6;
      padding: 3rem 2.5rem;
      border-radius: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        12px 12px 12px #d1d9e6,
        -12px -12px 12px #ffffff;
    }

    .lock-icon img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      background: #e9eef6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 30px;
      box-shadow:
        6px 6px 12px #d1d9e6,
        -6px -6px 12px #ffffff;
    }

    h2 {
      text-align: center;
      color: #1a202c;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      background: #e9eef6;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      color: #2d3748;
      box-shadow:
        inset 6px 6px 12px #d1d9e6,
        inset -6px -6px 12px #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
      color: #a0aec0;
    }

    .input-group input:focus {
      box-shadow:
        inset 4px 4px 8px #d1d9e6,
        inset -4px -4px 8px #ffffff,
        0 0 0 2px rgba(66, 153, 225, 0.3);
    }

    .row-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      font-size: 0.85rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4a5568;
    }

    .forgot-link {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
      font-size: 12px;
    }

    .btn-login {
      height: 40px;
      width: 50%;
      padding: 15px;
      background: linear-gradient(90deg, #000080, #00bfff, #ffffff);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(26, 115, 232, 0.5);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 5px auto 0;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(26, 115, 232, 0.5);
    }

    .login-message {
      display: none;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      background: #e9eef6;
      box-shadow:
        inset 6px 6px 12px #d1d9e6,
        inset -6px -6px 12px #ffffff;
    }

    .login-message.success {
      display: block;
      color: #15803d;
    }

    .login-message.error {
      display: block;
      color: #dc2626;
    }

    /* TOMBOL INFORMASI */
    .info-button {
  position: absolute !important;
  top: 18px !important;
  right: 20px !important;
  width: 20px;
  height: 20px;
  border: 2px solid #4682B4;
  border-radius: 50%;
  background: transparent;
  color: #4682B4;
  font-size: 15px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
}

    .info-button:hover {
      background: white;
      color: #0872d9;
      transform: scale(1.08);
    }

    /* POPUP INFORMASI APLIKASI */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 20, 50, 0.45);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      width: 90%;
      max-width: 340px;
      padding: 28px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      animation: muncul 0.3s ease;
    }

    @keyframes muncul {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .info-icon {
      margin: 0 auto 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #55baff, #0872d9);
      color: white;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content h2 {
      color: #14518a;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .version {
      color: #0872d9;
      font-weight: bold;
      margin: 15px 0;
    }

    .modal-content p {
      color: #718096;
      font-size: 13px;
      line-height: 1.6;
    }

    .footer {
      color: #9aa8b5;
      font-size: 11px;
      margin-top: 20px;
    }

    .modal-content button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #36a9f5, #0868cc);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

      .security-info {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #4682B4;
  font-size: 12px;
  font-weight: 600;
}

.security-icon {
  width: 20px;
  height: 20px;
  display: inline-flex;
}

.security-icon svg {
  width: 100%;
  height: 100%;
}
    
  </style>
</head>

<body>

  <!-- TOMBOL INFORMASI KANAN ATAS -->
  <div class="login-container">

  <button class="info-button" type="button" onclick="bukaInfo()" aria-label="Informasi aplikasi">i</button>

    <div class="lock-icon">
      <img src="gambar/sbmdi2.png" alt="Logo Login">
    </div>

    <h2>Selamat Datang</h2>
    <p class="subtitle">Silakan Masuk Dengan ID Share Anda</p>

    <div class="input-group">
      <input type="text" id="nama" placeholder="Nama Lengkap">
    </div>

    <div class="input-group">
      <input type="text" id="idShare" placeholder="ID Share">
    </div>

    <div class="row-options">
  <div class="security-info">
    <span class="security-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5L20 5.5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5.5L12 2.5Z"
          fill="#2878C8"/>
        <path d="M8.5 12L10.8 14.3L15.8 9.3"
          stroke="white" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>Akses Aman &amp; Terlindungi</span>
  </div>

  <a href="#" class="forgot-link">Lupa ID ?</a>
</div>

    <button class="btn-login" id="btn-login" type="button">MASUK</button>

    <div id="login-message" class="login-message"></div>

  </div>

  <!-- POPUP INFORMASI -->
  <div class="modal" id="infoModal" onclick="tutupJikaLuar(event)">
    <div class="modal-content">

      <div class="info-icon">i</div>

      <h2>SBMDI Komite Subang</h2>

      <div class="version">
        Application Version 1.1
      </div>

      <p>
        Aplikasi resmi SBMDI Komite Subang.
        <br>
        Media informasi dan komunikasi anggota serikat.
      </p>

      <div class="footer">
        © 2026 SBMDI Komite Subang All Right Reserved
      </div>

      <button type="button" onclick="tutupInfo()">Tutup</button>

    </div>
  </div>

  <script>

    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyWhCXJvf7OWFFh4z90PhoksoY7LnWBKn9ff9Q4T9kHH9ME0BVSWiOlecjZCLyKkoSG/exec";

    document.getElementById("btn-login").addEventListener("click", function() {
      const nama = document.getElementById("nama").value.trim();
      const idShare = document.getElementById("idShare").value.trim();
      const pesan = document.getElementById("login-message");
      const tombol = document.getElementById("btn-login");

      if (!nama || !idShare) {
        tampilkanPesan("Nama Lengkap dan ID Share wajib diisi.", false);
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "MEMERIKSA...";
      pesan.className = "login-message";
      pesan.style.display = "none";

      const callbackName = "hasilLoginSBMDI";

      window[callbackName] = function(hasil) {

        if (hasil.status === "success") {
          tampilkanPesan("Login Berhasil", true);

          tombol.textContent = "BERHASIL";

          setTimeout(function() {
            window.location.href = "loading.html";
          }, 700);

        } else {
          tampilkanPesan(hasil.message, false);

          tombol.disabled = false;
          tombol.textContent = "MASUK";
        }

        delete window[callbackName];
        document.getElementById("script-login").remove();
      };

      const script = document.createElement("script");
      script.id = "script-login";

      script.onerror = function() {
        tampilkanPesan("Gagal menghubungi server. Silakan coba lagi.", false);
        tombol.disabled = false;
        tombol.textContent = "MASUK";
        delete window[callbackName];
        script.remove();
      };

      script.src = URL_APPS_SCRIPT +
        "?nama=" + encodeURIComponent(nama) +
        "&idShare=" + encodeURIComponent(idShare) +
        "&callback=" + callbackName;

      document.body.appendChild(script);
    });

    function tampilkanPesan(teks, berhasil) {
      const pesan = document.getElementById("login-message");

      pesan.textContent = berhasil
        ? "Login Berhasil"
        : teks === "Nama Lengkap atau ID Share tidak cocok."
          ? "Nama Lengkap atau ID Share TIDAK TERDAFTAR/BELUM LENGKAP"
          : teks;

      pesan.className = "login-message " +
        (berhasil ? "success" : "error");
      pesan.style.display = "block";
    }

    /* FUNGSI POPUP INFORMASI */
    function bukaInfo() {
      document.getElementById("infoModal").style.display = "flex";
    }

    function tutupInfo() {
      document.getElementById("infoModal").style.display = "none";
    }

    function tutupJikaLuar(event) {
      if (event.target.id === "infoModal") {
        tutupInfo();
      }
    }

  </script>

</body>
</html>
