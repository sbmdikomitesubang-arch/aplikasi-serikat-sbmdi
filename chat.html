<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">
  <title>SAKA AI - Sahabat Karyawan Aqua</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202123;
    }

    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    /* HEADER */

    header {
      flex-shrink: 0;
      height: 58px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      z-index: 5;
    }

    .logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand strong {
      font-size: 16px;
      color: #18365b;
    }

    .brand span {
      font-size: 13px;
      color: #7b8794;
    }

    .header-right {
      margin-left: auto;
      color: #64748b;
      font-size: 9px;
    }

    /* CHAT AREA */

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .chat-content {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* HALAMAN AWAL */

    .welcome {
      margin: auto;
      padding: 30px 10px;
      text-align: center;
    }

    .welcome img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .welcome h1 {
      font-size: 25px;
      color: #18365b;
      margin: 0 0 10px;
    }

    .welcome p {
      font-size: 15px;
      line-height: 1.6;
      color: #718096;
      margin: 0;
    }

    /* PESAN */

    .message {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin-bottom: 27px;
      gap: 10px;
    }

    .user-message {
      align-self: flex-end;
      max-width: 88%;
      padding: 12px 17px;
      background: #2475c5;
      color: #ffffff;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: bold;
      color: #2475c5;
    }

    .bot-label img {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .bot-message {
      font-size: 16px;
      line-height: 1.75;
      color: #26384d;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .typing {
      font-size: 14px;
      color: #8795a6;
    }

    /* INPUT BAWAH */

    .bottom {
      flex-shrink: 0;
      width: 100%;
      background: #ffffff;
      padding: 9px 12px;
      padding-bottom: max(9px, env(safe-area-inset-bottom));
    }

    .input-box {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      min-height: 54px;
      border: 1px solid #d9dee5;
      border-radius: 28px;
      padding: 6px 8px 6px 17px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 40px;
      max-height: 120px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 10px 0;
      color: #26384d;
    }

    textarea::placeholder {
      color: #929ba7;
    }

    .icon-button {
      flex-shrink: 0;
      width: 39px;
      height: 39px;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      background: transparent;
      color: #64748b;
    }

    .send-button {
  background: #2475c5;
  color: white;
  font-size: 26px;
  font-weight: bold;
  line-height: 1;
}

    .icon-button:disabled {
      opacity: .4;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #929ba7;
      padding: 8px 3px 1px;
    }

    /* DESKTOP */

    @media (min-width: 700px) {
      header {
        padding: 0 25px;
      }

      main {
        padding: 35px 25px;
      }

      .welcome h1 {
        font-size: 29px;
      }
    }

    /* HP */

    @media (max-width: 699px) {
      header {
        height: 64px;
      }

      main {
        padding: 20px 15px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .user-message {
        max-width: 90%;
      }

      .bottom {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app" id="app">

  <!-- HEADER -->

  <header>
    <img
      class="logo"
      src="https://sbmdikomitesubang-arch.github.io/aplikasi-serikat-sbmdi/gambar/saka.png"
      alt="SAKA">

    <div class="brand">
      <strong>SAKA AI</strong>
      <span>Sahabat Karyawan Aqua</span>
    </div>

    <div class="header-right">
      SBMDI Komite Subang
    </div>
  </header>

  <!-- AREA CHAT -->

  <main id="chatArea">

    <div class="chat-content" id="chatContent">

      <div class="welcome" id="welcome">
        <img
          src="https://sbmdikomitesubang-arch.github.io/aplikasi-serikat-sbmdi/gambar/saka.png"
          alt="Logo SAKA">

        <h1>Apa yang bisa saya bantu?</h1>

        <p>
          Silakan tanyakan seputar ketenagakerjaan
          dan hubungan industrial.
        </p>
      </div>

    </div>

  </main>

  <!-- INPUT -->

  <div class="bottom">

    <div class="input-box">

      <textarea
        id="question"
        rows="1"
        placeholder="Tanya Saka..."
      ></textarea>

      <button
  class="icon-button"
  id="micButton"
  title="Input suara"
  onclick="mulaiMikrofon()"
>
  <svg
    width="23"
    height="23"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="9" y="2" width="6" height="12" rx="3"/>
    <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
    <path d="M12 19v3"/>
    <path d="M8 22h8"/>
  </svg>
</button>

      <button
  class="icon-button send-button"
  id="sendButton"
  title="Kirim"
  onclick="kirimPesan()"
>
  <svg width="22" height="22"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2.5"
       stroke-linecap="round"
       stroke-linejoin="round">
    <path d="M12 19V5"/>
    <path d="M6 11l6-6 6 6"/>
  </svg>
</button>
    </div>

    <div class="footer">
      SAKA AI dapat membuat kesalahan. Periksa informasi penting.
    </div>

  </div>

</div>

<script>

  let sedangMemproses = false;

  const input = document.getElementById("question");
  const area = document.getElementById("chatArea");
  const content = document.getElementById("chatContent");

  /* MENYESUAIKAN LAYAR HP */

  function sesuaikanLayar() {

    if (!window.visualViewport) return;

    const tinggi = window.visualViewport.height;
    const posisi = window.visualViewport.offsetTop;

    document.getElementById("app").style.height =
      tinggi + "px";

    document.getElementById("app").style.top =
      posisi + "px";
  }

  if (window.visualViewport) {

    window.visualViewport.addEventListener(
      "resize", sesuaikanLayar
    );

    window.visualViewport.addEventListener(
      "scroll", sesuaikanLayar
    );
  }

  window.addEventListener("resize", sesuaikanLayar);

  /* TINGGI INPUT */

  input.addEventListener("input", function() {

    this.style.height = "40px";

    this.style.height =
      Math.min(this.scrollHeight, 120) + "px";

  });

  /* ENTER UNTUK MENGIRIM */

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();
      kirimPesan();

    }

  });

  /* MENAMPILKAN PESAN */

  function tambahPesan(teks, tipe) {

    const message = document.createElement("div");
    message.className = "message";

    if (tipe === "user") {

      const bubble = document.createElement("div");
      bubble.className = "user-message";
      bubble.textContent = teks;

      message.appendChild(bubble);

    } else {

      const label = document.createElement("div");
      label.className = "bot-label";

      const logo = document.createElement("img");
      logo.src =
        "https://sbmdikomitesubang-arch.github.io/aplikasi-serikat-sbmdi/gambar/saka.png";

      const nama = document.createElement("span");
      nama.textContent = "SAKA";

      label.appendChild(logo);
      label.appendChild(nama);

      const jawaban = document.createElement("div");
      jawaban.className = "bot-message";
      jawaban.textContent = teks;

      message.appendChild(label);
      message.appendChild(jawaban);

    }

    content.appendChild(message);

    area.scrollTop = area.scrollHeight;

    return message;
  }

  
/* KIRIM PESAN KE SERVER SAKA */

const URL_SAKA =
  "https://script.google.com/macros/s/AKfycbz2zbiKya7PtScOaN81upgqNq8Xy2lK7AGpnzPN9EncZjjCnoM-8Cw9fHS_wuovFGCAtw/exec";

async function kirimPesan() {

  const pertanyaan = input.value.trim();

  if (!pertanyaan || sedangMemproses) return;

  document.getElementById("welcome").style.display = "none";

  tambahPesan(pertanyaan, "user");

  input.value = "";
  input.style.height = "40px";

  sedangMemproses = true;

  const tombolKirim = document.getElementById("sendButton");
  tombolKirim.disabled = true;

  const pesanLoading = tambahPesan("SAKA sedang berpikir...", "bot");

  try {

    const response = await fetch(URL_SAKA, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        message: pertanyaan
      })
    });

    const hasil = await response.json();

    pesanLoading.remove();

    if (!hasil.success) {
      throw new Error(hasil.error || "SAKA gagal memberikan jawaban.");
    }

    tambahPesan(hasil.answer, "bot");

  } catch (error) {

    pesanLoading.remove();

    tambahPesan(
      "Maaf, SAKA sedang mengalami gangguan. Silakan coba kembali.\n\nDetail: " + error.message,
      "bot"
    );

  } finally {

    sedangMemproses = false;
    tombolKirim.disabled = false;

  }
}

  /* MIKROFON */

  function mulaiMikrofon() {

    const PengenalSuara =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!PengenalSuara) {
      alert("Fitur mikrofon belum didukung browser ini.");
      return;
    }

    const pengenal = new PengenalSuara();

    pengenal.lang = "id-ID";
    pengenal.interimResults = false;

    pengenal.onresult = function(event) {

      input.value = event.results[0][0].transcript;

      input.dispatchEvent(new Event("input"));

    };

    try {
      pengenal.start();
    } catch (error) {
      alert("Mikrofon gagal dijalankan.");
    }

  }

</script>

</body>
</html>
