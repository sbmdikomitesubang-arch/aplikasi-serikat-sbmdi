<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si SAKA - SBMDI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #061c45, #0756a8, #1689d4, #ffffff);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: white;
}

.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 35px 24px;
  border-radius: 25px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}


.subtitle {
  font-size: 13px;
  color: #c9e8ff;
  margin-bottom: 28px;
}

.message {
  background: rgba(255,255,255,0.13);
  border-radius: 16px;
  padding: 22px 18px;
  line-height: 1.7;
  font-size: 16px;
  margin-bottom: 28px;
}

.chat-button {
  width: 100%;
  border: none;
  border-radius: 50px;
  padding: 17px 20px;
  font-size: 17px;
  font-weight: bold;
  color: #06458a;
  background: linear-gradient(135deg, #ffffff, #bde6ff);
  cursor: pointer;
  box-shadow: 0 7px 20px rgba(0,0,0,0.2);
  transition: 0.2s;
}

.chat-button:active {
  transform: scale(0.96);
}

.button-icon {
  margin-right: 8px;
}

.footer {
  margin-top: 30px;
  font-size: 11px;
  color: #c5e5ff;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
  <img src="gambar/saka.png" alt="Logo Si SAKA">
</div>

<div class="subtitle">
  Sahabat Karyawan Aqua
</div>

  <div class="message">
    Jika ada hal terkait hak pekerja, waktu kerja, upah,
    atau peraturan ketenagakerjaan silahkan Chat dengan si SAKA
  </div>

  <button class="chat-button" onclick="bukaSAKA()">
    <span class="button-icon"></span>
    CHAT DENGAN SAKA
  </button>

  <div class="footer">
    Sahabat informasi dan konsultasi ketenagakerjaan<br>
    SBMDI Komite Subang
  </div>

</div>

<script>
function bukaSAKA() {
  window.location.href =
  "https://sbmdikomitesubang-arch.github.io/aplikasi-serikat-sbmdi/chat.html";
}
</script>

</body>
</html>
