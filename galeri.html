<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0756a5">
<title>Galeri - SBMDI Komite Subang</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #eaf5ff, #ffffff 45%);
  color: #183653;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #0756a5, #168fe0);
  color: white;
  padding: 28px 20px 35px;
  border-radius: 0 0 25px 25px;
  box-shadow: 0 5px 18px rgba(0,70,140,.18);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.header h1 {
  font-size: 21px;
  letter-spacing: .4px;
}

.header p {
  font-size: 12px;
  margin-top: 5px;
  opacity: .9;
}

.header-desc {
  margin-top: 22px;
  font-size: 13px;
  line-height: 1.6;
  opacity: .95;
}

/* CONTENT */
.container {
  max-width: 850px;
  margin: auto;
  padding: 22px 16px 40px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.section-heading h2 {
  font-size: 19px;
  color: #124d82;
}

.section-heading span {
  font-size: 12px;
  color: #7290a9;
}

/* BUTTON */
.upload-button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #168fe0, #0756a5);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(0,90,170,.2);
  margin-bottom: 25px;
}

.upload-button:active {
  transform: scale(.98);
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.photo-card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(20,75,120,.09);
  cursor: pointer;
}

.photo-card img {
  display: block;
  width: 100%;
  height: 145px;
  object-fit: cover;
  background: #e5eff8;
}

.photo-info {
  padding: 11px;
}

.photo-info h3 {
  font-size: 13px;
  color: #174e7c;
  margin-bottom: 6px;
}

.photo-info p {
  font-size: 11px;
  color: #8196a9;
  line-height: 1.5;
}

/* EMPTY STATE */
.empty-state {
  display: none;
  padding: 35px 15px;
  text-align: center;
  color: #7892a9;
  background: white;
  border-radius: 15px;
  grid-column: 1 / -1;
}

.empty-state div {
  font-size: 40px;
  margin-bottom: 12px;
}

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,15,35,.94);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lightbox img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 10px;
}

.close-lightbox {
  position: absolute;
  top: 20px;
  right: 22px;
  color: white;
  font-size: 35px;
  cursor: pointer;
}

/* UPLOAD MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0,25,55,.65);
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal-content {
  background: white;
  width: 100%;
  max-width: 430px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 20px;
  padding: 22px;
}

.modal-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title h2 {
  font-size: 19px;
  color: #0756a5;
}

.close-modal {
  font-size: 27px;
  color: #8095a9;
  cursor: pointer;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #31516e;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d5e3ef;
  border-radius: 10px;
  outline: none;
  font-size: 14px;
  font-family: inherit;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #168fe0;
}

.form-group textarea {
  height: 85px;
  resize: vertical;
}

.file-box {
  border: 2px dashed #9cc7e8;
  border-radius: 13px;
  padding: 18px;
  text-align: center;
  background: #f3f9ff;
}

.file-box label {
  color: #0874c6;
  cursor: pointer;
}

.file-box input {
  display: none;
}

.file-preview {
  display: none;
  width: 100%;
  max-height: 190px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

.submit-button {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 14px;
  background: linear-gradient(135deg, #168fe0, #0756a5);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.submit-button:disabled {
  opacity: .6;
}

.note {
  text-align: center;
  color: #91a4b5;
  font-size: 11px;
  margin-top: 25px;
}

  
/* NAVIGASI HALAMAN */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 25px;
}

.pagination button {
  min-width: 38px;
  height: 38px;
  padding: 0 10px;
  border: 1px solid #c8dff2;
  border-radius: 9px;
  background: white;
  color: #0756a5;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.pagination button.active {
  background: linear-gradient(135deg, #168fe0, #0756a5);
  color: white;
  border-color: #0756a5;
}

.pagination button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

@media (min-width: 600px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .photo-card img {
    height: 180px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div class="header-icon">📸</div>
    <div>
      <h1>GALERI KEGIATAN</h1>
      <p>SBMDI KOMITE SUBANG</p>
    </div>
  </div>

  <div class="header-desc">
    Dokumentasi kegiatan, kebersamaan, dan perjuangan
    keluarga besar SBMDI Komite Subang.
  </div>
</header>

<main class="container">

  <div class="section-heading">
    <h2>Dokumentasi Kegiatan</h2>
    <span id="photoCount">0 Foto</span>
  </div>

  <button class="upload-button" onclick="openUpload()">
    ＋ Upload Foto Kegiatan
  </button>

  <div class="gallery" id="gallery">

    <div class="empty-state" id="emptyState">
      <div>🖼️</div>
      <h3>Belum Ada Foto</h3>
      <p>Dokumentasi kegiatan akan tampil di halaman ini.</p>
    </div>

  </div>

    <!--NAVIGASI HALAMAN FOTO -->
    <div id="pagination" class="pagination"></div>

  <p class="note">
    © SBMDI KOMITE SUBANG
  </p>

</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close-lightbox">&times;</span>
  <img id="largeImage" src="" alt="Foto kegiatan">
</div>

<!-- FORM UPLOAD -->
<div class="modal" id="uploadModal">
  <div class="modal-content">

    <div class="modal-title">
      <h2>Upload Foto Kegiatan</h2>
      <span class="close-modal" onclick="closeUpload()">&times;</span>
    </div>

    <form id="uploadForm">

      <div class="form-group">
        <label>Pilih Foto</label>
        <div class="file-box">
          <label for="photoInput">
            📁 Pilih Foto dari HP
          </label>
          <input type="file" id="photoInput"
                 accept="image/*" required>
          <img id="preview" class="file-preview" alt="Preview foto">
        </div>
      </div>

      <div class="form-group">
        <label>Nama Kegiatan</label>
        <input type="text" id="activityName"
               placeholder="Contoh: Rapat Koordinasi" required>
      </div>

      <div class="form-group">
        <label>Tanggal Kegiatan</label>
        <input type="date" id="activityDate" required>
      </div>

      <div class="form-group">
        <label>Keterangan</label>
        <textarea id="description"
          placeholder="Tuliskan keterangan kegiatan..."></textarea>
      </div>

      <div class="form-group">
  	<label>Kode Akses Petugas</label>
 	<input type="password" id="accessCode" placeholder="Masukkan kode akses"required>
	</div>

      <button type="submit" class="submit-button" id="submitButton">
        Upload Foto
      </button>

    </form>

  </div>
</div>

<script>


// URL WEB APP APPS SCRIPT
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzDGYtY5yc5y0fsI6WjL3CovU5YIlhBjT8zqNdpqsij2fZtrkVRPHI8iH6Aen0A774r/exec";

// DATA GALERI
let photos = [];
let currentPage = 1;
const photosPerPage = 10;

const gallery = document.getElementById("gallery");
const emptyState = document.getElementById("emptyState");

// FORMAT TANGGAL
function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (isNaN(date.getTime())) return value;

  return date.toLocaleDateString("id-ID", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

// TAMPILKAN FOTO

function renderGallery() {
  gallery.querySelectorAll(".photo-card")
    .forEach(el => el.remove());

  const totalPages = Math.ceil(photos.length / photosPerPage);

  if (currentPage > totalPages) {
    currentPage = Math.max(1, totalPages);
  }

  emptyState.style.display =
    photos.length ? "none" : "block";

  // Ambil maksimal 10 foto sesuai halaman
  const startIndex = (currentPage - 1) * photosPerPage;
  const endIndex = startIndex + photosPerPage;

  const pagePhotos = photos.slice(startIndex, endIndex);

  pagePhotos.forEach(photo => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = photo.src;
    img.alt = photo.name;
    img.loading = "lazy";
    img.onclick = () => showImage(photo.src);

    const info = document.createElement("div");
    info.className = "photo-info";

    const title = document.createElement("h3");
    title.textContent = photo.name;

    const date = document.createElement("p");
    date.textContent = photo.date;

    const desc = document.createElement("p");
    desc.textContent = photo.description || "";

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Hapus Foto";
    deleteButton.type = "button";
    deleteButton.style.cssText =
      "width:100%;margin-top:10px;padding:9px;border:0;border-radius:8px;background:#dc3545;color:white;font-weight:bold;cursor:pointer;";

    deleteButton.onclick = function(e) {
      e.stopPropagation();
      hapusFoto(photo.idFoto);
    };

    info.append(title, date, desc, deleteButton);
    card.append(img, info);

    gallery.appendChild(card);
  });

  // Jumlah seluruh foto
  document.getElementById("photoCount").textContent =
    photos.length + " Foto";

  // Buat navigasi halaman
  renderPagination(totalPages);
}


// MEMBUAT NAVIGASI HALAMAN
function renderPagination(totalPages) {
  const pagination = document.getElementById("pagination");
  pagination.innerHTML = "";

  if (totalPages <= 1) {
    return;
  }

  function buatTombol(teks, halaman, aktif = false, disabled = false) {
    const button = document.createElement("button");

    button.textContent = teks;
    button.disabled = disabled;

    if (aktif) {
      button.classList.add("active");
    }

    button.onclick = function() {
      currentPage = halaman;
      renderGallery();

      window.scrollTo({
        top: document.querySelector(".section-heading").offsetTop - 15,
        behavior: "smooth"
      });
    };

    pagination.appendChild(button);
  }

  // Tombol sebelumnya
  buatTombol("‹", currentPage - 1, false, currentPage === 1);

  // Nomor halaman
  for (let i = 1; i <= totalPages; i++) {
    buatTombol(i, i, i === currentPage);
  }

  // Tombol berikutnya
  buatTombol("›", currentPage + 1, false, currentPage === totalPages);
}

// AMBIL DATA DARI SPREADSHEET
async function loadGallery() {
  try {
    const response = await fetch(URL_SCRIPT + "?t=" + Date.now());
    const result = await response.json();

    if (result.status !== "success") {
      throw new Error(result.message || "Gagal membaca galeri");
    }

    result.photos.sort((a, b) =>
	new Date(b.tanggalUpload) - new
    Date(a.tanggalUpload)
    );

    photos = result.photos.map(photo => ({
  idFoto: photo.id,
  src: photo.url,
  name: photo.namaKegiatan || "Dokumentasi Kegiatan",
  date: formatDate(photo.tanggalKegiatan || photo.tanggalUpload),
  description: photo.keterangan || ""
}));

    renderGallery();

  } catch (error) {
    console.error("Gagal memuat galeri:", error);
    alert("Gagal mengambil data galeri. Periksa koneksi internet.");
  }
}

// BUKA FORM UPLOAD
function openUpload() {
  document.getElementById("uploadModal").style.display = "flex";
}

function closeUpload() {
  document.getElementById("uploadModal").style.display = "none";
}

// PREVIEW FOTO
document.getElementById("photoInput")
.addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("preview");

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Silakan pilih file gambar.");
    this.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Ukuran foto maksimal 5 MB.");
    this.value = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

// UPLOAD KE GOOGLE DRIVE DAN SPREADSHEET
document.getElementById("uploadForm")
.addEventListener("submit", async function(e) {
  e.preventDefault();

  const file = document.getElementById("photoInput").files[0];
  const button = document.getElementById("submitButton");

  if (!file) {
    alert("Pilih foto terlebih dahulu.");
    return;
  }

  button.disabled = true;
  button.textContent = "Mengunggah foto...";

  try {
    const photo = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("Gagal membaca foto"));

      reader.readAsDataURL(file);
    });

    const payload = {
     fileName: file.name,
     mimeType: file.type || "image/jpeg",
     photo: photo,
     namaKegiatan: document.getElementById("activityName").value,
     tanggalKegiatan: document.getElementById("activityDate").value,
     keterangan: document.getElementById("description").value,
     kodeAkses: document.getElementById("accessCode").value
    };

    const response = await fetch(URL_SCRIPT, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.status !== "success") {
      throw new Error(result.message || "Upload gagal");
    }

    alert("Foto berhasil diunggah dan dicatat!");

    document.getElementById("uploadForm").reset();
    document.getElementById("preview").style.display = "none";

    closeUpload();

    await loadGallery();

  } catch (error) {
    console.error("Upload error:", error);
    alert("Gagal: " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "Upload Foto";
  }
});

   // FUNGSI HAPUS FOTO
async function hapusFoto(idFoto) {
  const konfirmasi = confirm(
    "Apakah kamu yakin ingin menghapus foto ini?"
  );

  if (!konfirmasi) return;

  const kodeAkses = prompt("Masukkan kode akses petugas:");

  if (!kodeAkses) {
    alert("Kode akses wajib diisi.");
    return;
  }

  try {
    const response = await fetch(URL_SCRIPT, {
      method: "POST",
      body: JSON.stringify({
        aksi: "hapus",
        idFoto: idFoto,
        kodeAkses: kodeAkses
      })
    });

    const result = await response.json();

    if (result.status !== "success") {
      throw new Error(result.message || "Gagal menghapus foto.");
    }

    alert("Foto berhasil dihapus.");

    await loadGallery();

  } catch (error) {
    alert("Penghapusan gagal: " + error.message);
  }
}


// LIGHTBOX
function showImage(src) {
  document.getElementById("largeImage").src = src;
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

// MUAT GALERI SAAT HALAMAN DIBUKA
loadGallery();

</script>

</body>
</html>
